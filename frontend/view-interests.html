<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interested Users</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    padding:30px;
}

h1{
    text-align:center;
    color:#2563eb;
}

.user-card{
    background:white;
    padding:20px;
    margin:15px auto;
    max-width:700px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.email{
    color:#2563eb;
    font-weight:bold;
}

.time{
    color:gray;
    margin-top:8px;
}

.message-card{
    background:#fff;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.message-card h3{
    margin-bottom:8px;
}

.message-card button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
}

</style>

</head>
<body>

<h1>Interested Users</h1>

<div id="usersContainer"></div>

<script src="view-interests.js"></script>

</body>
</html>
