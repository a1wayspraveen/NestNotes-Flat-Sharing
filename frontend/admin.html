<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="stats-grid">

    <div class="card">
        <h2 id="totalListings">0</h2>
        <p>Total Listings</p>
    </div>

    <div class="card">
        <h2 id="verifiedListings">0</h2>
        <p>Verified Listings</p>
    </div>

    <div class="card">
        <h2 id="pendingListings">0</h2>
        <p>Pending Listings</p>
    </div>

    </div>

    <h1>Admin Dashboard</h1>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Title</th>
                <th>Rent</th>
                <th>Location</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="listingsTable"></tbody>
    </table>

    <script src="admin.js"></script>

</body>
</html>
