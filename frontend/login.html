<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <h2>Welcome Back 👋</h2>
            <p class="auth-subtitle">
                Login to manage your listings
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>

            <p id="message"></p>

            <div class="auth-links">
                <a href="register.html">
                    Create Account
                </a>
            </div>

        </div>

    </div>

<script>
document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async (e) => {

            e.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const response =
                await fetch(
                    "https://nestnotes-flat-sharing.onrender.com/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                );

            const data =
                await response.json();

            if(response.ok){

                localStorage.setItem(
                    "token",
                    data.token
                );

                localStorage.setItem(
                    "userId",
                    data.user.id
                );

                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                window.location.href =
                    "index.html";

            } else {

                document
                    .getElementById("message")
                    .innerText =
                    data.message;
            }
        }
    );
</script>

</body>
</html>
