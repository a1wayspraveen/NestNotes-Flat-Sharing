<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>Register</h2>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <a href="login.html">
            Already have an account?
        </a>

    </div>

    <script>
        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async (e) => {

                    e.preventDefault();

                    const name =
                        document.getElementById("name").value;

                    const email =
                        document.getElementById("email").value;

                    const password =
                        document.getElementById("password").value;

                    const response =
                        await fetch(
                            "http://localhost:3000/api/auth/register",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                    "application/json"
                                },
                                body: JSON.stringify({
                                    name,
                                    email,
                                    password
                                })
                            }
                        );

                    const data =
                        await response.json();

                    document
                        .getElementById("message")
                        .innerText =
                        response.ok
                        ? "Registration successful"
                        : data.message;
                }
            );
    </script>

</body>
</html>
