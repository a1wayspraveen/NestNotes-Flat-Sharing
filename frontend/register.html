<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | NestNotes</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        /* Register page styling */
        .auth-page {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef8f5, #f4f7fb);
            font-family: Arial, sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            margin: auto;
        }

        .auth-card {
            background: #ffffff;
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(20, 70, 60, 0.10);
            border: 1px solid #e8efec;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 26px;
            color: #087f68;
            font-size: 25px;
            font-weight: 800;
        }

        .brand-icon {
            display: inline-flex;
            width: 42px;
            height: 42px;
            align-items: center;
            justify-content: center;
            background: #e3f5ef;
            border-radius: 13px;
            font-size: 23px;
        }

        .auth-card h1 {
            margin: 0 0 10px;
            color: #172b27;
            font-size: 29px;
            text-align: center;
        }

        .auth-subtitle {
            margin: 0 0 28px;
            color: #687873;
            text-align: center;
            line-height: 1.6;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #344640;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            min-height: 48px;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #d8e2de;
            border-radius: 10px;
            outline: none;
            background: #fbfdfc;
            color: #20332e;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #0b987b;
            box-shadow: 0 0 0 3px rgba(11, 152, 123, 0.12);
            background: #fff;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 76px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            padding: 6px;
            border: none;
            background: transparent;
            color: #087f68;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .password-hint {
            display: block;
            margin-top: 7px;
            color: #77847f;
            font-size: 12px;
        }

        .auth-btn {
            width: 100%;
            min-height: 49px;
            margin-top: 8px;
            border: none;
            border-radius: 11px;
            background: #07866e;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .auth-btn:hover {
            background: #066d59;
            transform: translateY(-1px);
        }

        .auth-btn:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        .auth-message {
            display: none;
            margin: 16px 0 0;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .auth-message.success {
            display: block;
            color: #126342;
            background: #e8f8ee;
            border: 1px solid #c6ead3;
        }

        .auth-message.error {
            display: block;
            color: #a72e2e;
            background: #fff0f0;
            border: 1px solid #f3cece;
        }

        .auth-links {
            margin-top: 24px;
            text-align: center;
            color: #65746e;
            font-size: 14px;
        }

        .auth-links a {
            color: #087f68;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .auth-footer {
            margin-top: 22px;
            color: #84918c;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .auth-page {
                padding: 16px;
            }

            .auth-card {
                padding: 26px 20px;
                border-radius: 17px;
            }

            .auth-card h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body class="auth-page">

    <main class="auth-container">
        <section class="auth-card">

            <div class="auth-brand">
                <span class="brand-icon">🏡</span>
                <span>NestNotes</span>
            </div>

            <h1>Create your account</h1>

            <p class="auth-subtitle">
                Find your space, meet your future flatmates,
                and make yourself at home.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>

                    <small class="password-hint">
                        Use at least 8 characters.
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleConfirmPassword"
                            aria-label="Show confirmation password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="registerButton">
                    Create Account
                </button>

                <p
                    id="message"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

            <div class="auth-links">
                Already have an account?
                <a href="login.html">Log in</a>
            </div>

            <div class="auth-footer">
                © 2026 NestNotes Flat Sharing
            </div>

        </section>
    </main>

    <script>
        const API_URL =
            "https://nestnotes-flat-sharing.onrender.com/api";

        const registerForm =
            document.getElementById("registerForm");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const registerButton =
            document.getElementById("registerButton");

        const messageElement =
            document.getElementById("message");


        function showMessage(text, type) {
            messageElement.textContent = text;
            messageElement.className = `auth-message ${type}`;
        }


        function setupPasswordToggle(inputId, buttonId) {
            const input = document.getElementById(inputId);
            const button = document.getElementById(buttonId);

            button.addEventListener("click", () => {
                const shouldShow = input.type === "password";

                input.type = shouldShow ? "text" : "password";
                button.textContent = shouldShow ? "Hide" : "Show";

                button.setAttribute(
                    "aria-label",
                    shouldShow ? "Hide password" : "Show password"
                );

                button.setAttribute(
                    "aria-pressed",
                    String(shouldShow)
                );
            });
        }


        setupPasswordToggle("password", "togglePassword");

        setupPasswordToggle(
            "confirmPassword",
            "toggleConfirmPassword"
        );


        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!name) {
                showMessage("Please enter your full name.", "error");
                nameInput.focus();
                return;
            }

            if (password.length < 8) {
                showMessage(
                    "Your password must contain at least 8 characters.",
                    "error"
                );
                passwordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "The passwords do not match. Please try again.",
                    "error"
                );
                confirmPasswordInput.focus();
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = "Creating account...";

            showMessage("Connecting to NestNotes...", "success");

            try {
                const response = await fetch(
                    `${API_URL}/auth/register`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name,
                            email,
                            password
                        })
                    }
                );

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Registration failed. Please try again."
                    );
                }

                showMessage(
                    data.message ||
                    "Your account was created successfully! You can now log in.",
                    "success"
                );

                registerForm.reset();

                registerButton.textContent = "Account Created";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                console.error("Registration error:", error);

                showMessage(
                    error.message ||
                    "Unable to connect. Please try again.",
                    "error"
                );

                registerButton.disabled = false;
                registerButton.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
